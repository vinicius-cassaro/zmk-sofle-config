# Ativa o suporte a iluminação RGB (WS2812/SK6812)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

CONFIG_ZMK_BACKLIGHT=y

# Configuração inicial da iluminação RGB
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# Desliga os LEDs automaticamente quando o teclado entra em repouso (Deep Sleep)
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y

# Mantém o controle de alimentação do circuito RGB pelo underglow.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y

# Não desligue os LEDs ao desconectar o USB: o teclado é usado por Bluetooth.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

CONFIG_ZMK_BACKLIGHT_AUTO_OFF_USB=y

# Configuração de iluminação inicial padrão
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10

# Opcional: Gerenciamento avançado de energia para Nice!Nano
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_PM_SOFT_OFF=y

# Pareamento seguro: o host exibe o código de seis dígitos e ele é digitado
# no teclado antes que o vínculo seja aceito.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y