# Ativa o suporte a iluminação RGB (WS2812/SK6812)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Desliga os LEDs automaticamente quando o teclado entra em repouso (Deep Sleep)
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Desliga os LEDs quando a conexão Bluetooth é perdida
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# Configuração de iluminação inicial padrão
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10

# Opcional: Gerenciamento avançado de energia para Nice!Nano
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000